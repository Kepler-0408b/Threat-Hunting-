        <div class="err" id="tf-err"></div></form>`,
      foot:`<span class="spacer"></span><button class="btn" type="button" data-close>Hủy</button><button class="btn primary" type="button" id="tf-ok">${ic("check")}${t?"Lưu":"Giao việc"}</button>`});
    $("#tf-team").onchange=()=>{ $("#tf-checks").innerHTML=checks($("#tf-team").value); };
    const ok=async()=>{ const name=$("#tf-name").value.trim(); if(!name){ $("#tf-err").textContent="Nhập tên công việc."; $("#tf-name").focus(); return; }
      const desc=$("#tf-desc").value.trim(), due=$("#tf-due").value||"", teamId=$("#tf-team").value;
      const assignees=[...document.querySelectorAll('#tf-checks input:checked')].map(x=>x.value);
      $("#tf-ok").disabled=true;
      try{
        if(t) await Store.saveTask(Object.assign({},Store.tasks[t.id]||t,{name,desc,due,teamId,assignees}));
        else { const taken=new Set(Store.allTasks().map(x=>x.id)); let i=taken.size+1, id; do{ id="T"+i++; }while(taken.has(id));
          await Store.saveTask({id,name,desc,due,teamId,by,assignees,createdAt:Date.now()}); }
        closeModal(); toast(t?"Đã lưu công việc":"Đã giao việc mới"); }
      catch(e){ writeErr(e); $("#tf-ok").disabled=false; } };
    $("#tf-ok").onclick=ok; $("#tf").onsubmit=e=>{e.preventDefault();ok();}; $("#tf-name").focus(); };
  $("#addTask").onclick=()=>form(null);
  view.querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>form(Store.task(b.dataset.tedit)));
  view.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{ const t=Store.task(b.dataset.tdel);
    openModal({title:"Xóa công việc?",body:`<p style="margin:0">Xóa <b>${esc(t.name)}</b> ${taskTag(t)}. Bài đã nộp cho việc này vẫn được giữ.</p>`,
      foot:`<span class="spacer"></span><button class="btn" type="button" data-close>Hủy</button><button class="btn danger" type="button" id="td-ok">${ic("trash")}Xóa</button>`});
    $("#td-ok").onclick=async()=>{ try{ await Store.deleteTask(t.id); closeModal(); toast("Đã xóa công việc"); }catch(e){ writeErr(e); } }; });
}

/* ---------------- timeline pieces ---------------- */
function versionItem(t,v,showNote){
  const url=v.link&&safeUrl(v.link);
  return `<div class="tl-item"><span class="tl-dot ver">${ic("up")}</span><div class="tl-box">
    <div class="tl-head"><span class="vtag">v${v.v}</span><b>Nộp bài</b><span class="when">${fmtDate(v.submittedAt)}</span></div>
    <div class="tl-title">${esc(v.title)}</div>
    ${v.description?`<div class="tl-text muted" style="margin-top:4px">${esc(v.description)}</div>`:""}
    ${v.changeNote?`<div class="change"><b>Đã sửa so với bản trước</b>${esc(v.changeNote)}</div>`:""}
    <dl class="tl-kv">
      ${url?`<dt>Link</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(v.link)}</a></dd>`:""}
      ${showNote&&v.memberNote?`<dt>Ghi chú cho Leader</dt><dd>${esc(v.memberNote)}</dd>`:""}
    </dl></div></div>`;
}
function reviewItem(t,r,showPrivate,showTask){
  const meta=ST[r.status]||ST.submitted; const k=r.status==="revise"?"fix":r.status==="passed"?"pass":"rev";
  return `<div class="tl-item"><span class="tl-dot rev-${k}">${ic(r.status==="passed"?"check":r.status==="revise"?"x":"edit")}</span><div class="tl-box review">
    <div class="tl-head"><b>Leader nhận xét</b><span class="vtag">v${r.v}</span>${badge(r.status)}${r.score!=null?scoreHtml(r.score):""}
      ${showTask?`<span class="faint">· ${esc(Store.taskName(t.taskId))}</span>`:""}<span class="when">${fmtDate(r.at)}</span></div>
    ${r.feedback?`<div class="tl-text">${esc(r.feedback)}</div>`:`<div class="faint" style="font-size:13.5px">Không có feedback.</div>`}
    ${showPrivate&&r.privateNote?`<div class="private"><b>${ic("lock")}Ghi chú riêng của Leader</b>${esc(r.privateNote)}</div>`:""}
  </div></div>`;
}
function timelineHTML(t){
  const priv=App.canSeePrivate(t); const own=App.role()==="member"&&App.me()===t.memberId;
  const ev=[]; t.versions.forEach(v=>ev.push({at:v.submittedAt,h:versionItem(t,v,priv||own)}));
  (t.reviews||[]).forEach(r=>ev.push({at:r.at,h:reviewItem(t,r,priv,false)}));
  ev.sort((a,b)=>b.at-a.at);
  return `<div class="tl">${ev.map(e=>e.h).join("")}</div>`;
}

/* ---------------- comments (peer feedback) ---------------- */
function canDeleteComment(c){
  if(!App.session) return false;
  if(App.isTeacher()) return true;
  if(c.authorKey===App.author().key) return true;
  const t=Store.threads[c.threadId]; return !!(t && App.canReview(t));
}
function commentItems(threadId){
  const list=Store.commentsOf(threadId);
  if(!list.length) return `<div class="faint" style="font-size:13.5px;padding:4px 0">Chưa có góp ý nào. Hãy là người đầu tiên.</div>`;
  return list.map(c=>{
    const p=c.authorMember?Store.person(c.authorMember):null;
    const av=c.authorRole==="teacher"?`<span class="av teach">GV</span>`:c.authorRole==="leader"?`<span class="av lead">LD</span>`:avatar(p||{name:c.authorName});
    const roleTag=c.authorRole==="teacher"?`<span class="tag tag-gv">Giảng viên</span>`:c.authorRole==="leader"?`<span class="tag tag-ld">Leader</span>`:"";
    return `<div class="cmt">${av}<div class="cmt-b">
      <div class="cmt-h"><b>${esc(c.authorName)}</b>${roleTag}${c.authorTeam&&Store.team(c.authorTeam)?teamChip(c.authorTeam):""}<span class="vtag">v${c.v}</span><span class="when">${ago(c.at)}</span>
        ${canDeleteComment(c)?`<button class="icon-btn sm" type="button" data-cdel="${esc(c.id)}" title="Xóa góp ý" aria-label="Xóa góp ý">${ic("trash")}</button>`:""}</div>
      <div class="cmt-t">${esc(c.text)}</div></div></div>`;
  }).join("");
}
function commentsBlock(t, inputId){
  const n=Store.commentsOf(t.id).length;
  return `<div class="cmts" data-cmt-thread="${esc(t.id)}">
    <div class="section-label">${ic("chat")}Góp ý từ mọi người <span data-cmt-count>${n}</span></div>
    <div class="cmt-list" data-cmt-list="${esc(t.id)}">${commentItems(t.id)}</div>
    <form class="cmt-form" data-cmt-form="${esc(t.id)}">
      <textarea id="${inputId}" maxlength="1000" placeholder="Góp ý cho bài này: điểm hay, chỗ chưa rõ, nguồn tham khảo gợi ý…"></textarea>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="faint" style="font-size:12.5px">Đăng với tên <b>${esc(App.author().name)}</b></span><span class="spacer"></span>
        <button class="btn primary sm" type="submit">${ic("send")}Gửi góp ý</button></div>
    </form></div>`;
}
function bindComments(scopeEl){
  scopeEl.querySelectorAll("[data-cmt-form]").forEach(f=>f.onsubmit=async e=>{ e.preventDefault();
    const ta=f.querySelector("textarea"); const text=ta.value.trim(); if(!text){ ta.focus(); return; }
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    try{ await Store.addComment(f.dataset.cmtForm, text, App.author()); ta.value=""; toast("Đã gửi góp ý"); }
    catch(err){ writeErr(err); } btn.disabled=false; });
  bindCommentDeletes(scopeEl);
}
function bindCommentDeletes(scopeEl){

function refreshModalComments(){
  const root=$("#modalRoot"); if(!root) return;

/* ---------------- thread modal ---------------- */
function openThread(id){
  const t=Store.threads[id]; if(!t) return;
  const p=Store.person(t.memberId)||{name:t.memberId,teams:[]}; const last=t.versions[t.versions.length-1];
  const canRev=App.canReview(t); const tTeam=Store.threadTeam(t); const left=!p.teams.includes(tTeam);
  const lastRev=(t.reviews||[]).filter(r=>r.v===t.versions.length).slice(-1)[0];
  const cur=lastRev||{status:t.status==="submitted"?"reviewing":t.status, score:null, feedback:"", privateNote:""};
  const seg=(k)=>`<label><input type="radio" name="rs" value="${k}" ${cur.status===k?"checked":""}><i style="background:${ST[k].color}"></i>${ST[k].label}</label>`;
  let panel="";
  if(canRev) panel=`
    <div class="review-panel">
      <h3>${ic("edit")}Nhận xét cho bản <span class="vtag">v${t.versions.length}</span></h3>
      ${t.status==="submitted"?`<div class="callout wait" style="padding:11px 14px;align-items:center">${ic("clock")}<div class="cd" style="margin:0;flex:1">Bài mới nộp.</div><button type="button" class="btn sm" id="startRev">Đánh dấu Đang review</button></div>`:""}
      <div class="field"><span class="flabel">Kết quả</span><div class="seg">${seg("reviewing")}${seg("revise")}${seg("passed")}</div></div>
      <div class="field"><label for="r-score">Điểm (0–10)</label>
        <div class="score-row"><input type="range" id="r-range" min="0" max="10" step="0.5" value="${cur.score==null?7:cur.score}" aria-label="Thanh điểm">
          <input type="text" id="r-score" inputmode="decimal" value="${cur.score==null?"":cur.score}" placeholder="—"></div>
        <span class="hint">Để trống nếu chưa muốn chấm điểm.</span></div>
      <div class="field"><label for="r-fb">Feedback <span class="faint" style="font-weight:400">· mọi người đều thấy</span></label>
        <textarea id="r-fb" placeholder="Nhận xét, điểm cần sửa, gợi ý…">${lastRev?esc(lastRev.feedback):""}</textarea></div>
      <div class="field"><label for="r-note">Ghi chú riêng <span class="faint" style="font-weight:400">· chỉ Leader team này và Giảng viên thấy</span></label>
        <textarea id="r-note" style="min-height:60px" placeholder="Ghi chú nội bộ…">${lastRev?esc(lastRev.privateNote):""}</textarea></div>
      <div class="err" id="r-err"></div>
    </div>`;
  else if(App.isTeacher()) panel=`<div class="callout none">${ic("eye")}<div class="cd" style="margin:0">Chế độ Giảng viên: chỉ xem. Toàn bộ nhận xét và ghi chú riêng của Leader được hiển thị bên dưới.</div></div>`;
  else if(App.isLeader()) panel=`<div class="callout none">${ic("eye")}<div class="cd" style="margin:0">Bài của ${esc(Store.teamName(tTeam))}: bạn xem và góp ý được, còn chấm điểm là việc của Leader team đó.</div></div>`;

  openModal({ wide:true, title:`${esc(p.name)} → ${esc(Store.taskName(t.taskId))}`,
    sub:`${esc(Store.teamName(tTeam))}${left?" (đã rời team)":""} · ${t.versions.length} lần nộp · ${(t.reviews||[]).length} nhận xét · cập nhật ${ago(t.updatedAt)}`,
    body:`<div class="stack">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${teamChip(tTeam,left)}${badge(t.status)}${scoreHtml(t.score)}<span class="faint" style="font-size:13.5px">Bản mới nhất: <b style="color:var(--ink)">${esc(last.title)}</b></span></div>
      ${panel}
      <div><div class="section-label">Lịch sử nộp & nhận xét</div>${timelineHTML(t)}</div>
      ${commentsBlock(t,"cmt-in-modal")}</div>`,
    foot: canRev? `<button class="btn danger" type="button" id="r-fix">${ic("warn")}Yêu cầu sửa & nộp lại</button><span class="spacer"></span>
      <button class="btn" type="button" data-close>Đóng</button><button class="btn primary" type="button" id="r-save">${ic("check")}Lưu nhận xét</button>`
      : `<span class="spacer"></span><button class="btn" type="button" data-close>Đóng</button>` });
  bindComments($("#modalRoot"));
  if(!canRev) return;
  const range=$("#r-range"), sc=$("#r-score");
  range.oninput=()=>{ sc.value=range.value; };
  sc.oninput=()=>{ const v=parseFloat(sc.value.replace(",",".")); if(!isNaN(v)&&v>=0&&v<=10) range.value=v; };
  const sr=$("#startRev"); if(sr) sr.onclick=async()=>{ try{ await Store.markReviewing(t.id); toast("Đã chuyển sang Đang review"); closeModal(); setTimeout(()=>openThread(t.id),50); }catch(e){ writeErr(e); } };
  const collect=(forceStatus)=>{
    const raw=sc.value.trim().replace(",","."); let score=null;
    if(raw!==""){ score=parseFloat(raw); if(isNaN(score)||score<0||score>10){ $("#r-err").textContent="Điểm phải là số từ 0 đến 10."; return null; } score=Math.round(score*10)/10; }
    const status=forceStatus||(document.querySelector('input[name="rs"]:checked')||{}).value||"reviewing";
    const feedback=$("#r-fb").value.trim();
    if(status==="revise"&&!feedback){ $("#r-err").textContent="Khi yêu cầu sửa, hãy ghi feedback để thành viên biết cần sửa gì."; $("#r-fb").focus(); return null; }
    return {status,score,feedback,privateNote:$("#r-note").value.trim()};
  };
  const save=async(force)=>{ const r=collect(force); if(!r) return;
    $("#r-save").disabled=true; $("#r-fix").disabled=true;
    try{ await Store.review(t.id,r,App.author().name); closeModal(); toast(r.status==="revise"?`Đã yêu cầu ${p.name} sửa và nộp lại`:r.status==="passed"?`${p.name}: Đạt ✓`:"Đã lưu nhận xét"); }
    catch(e){ writeErr(e); $("#r-save").disabled=false; $("#r-fix").disabled=false; } };
  $("#r-save").onclick=()=>save(null);
  $("#r-fix").onclick=()=>save("revise");
}

/* ---------------- member page ---------------- */
function viewMine(view){
  const me=App.me(); const p=Store.person(me); if(!p){ view.innerHTML=""; return; }
  const myTasks=Store.tasksForPerson(me);
  const threads=Store.threadsOf(me);
  const asg=Store.assigned(me);
  const pickDefault=()=>{ const open=asg.find(k=>{ const th=Store.threads[me+"__"+k.id]; return !th||th.status!=="passed"; }); return (open||asg[0]||threads[0]&&Store.task(threads[0].taskId)||myTasks[0]||{}).id||""; };
  let curTask=App.mineTask && myTasks.some(x=>x.id===App.mineTask) ? App.mineTask : pickDefault();
  App.mineTask=curTask;
  const k=Store.task(curTask);
  const t=Store.threads[me+"__"+curTask]||null;
  const st=t?t.status:"not_submitted";
  const lastRev=t&&(t.reviews||[]).slice(-1)[0];
  const nextV=t?t.versions.length+1:1;
  const canSubmit=!!curTask && st!=="passed";
  const prev=t?t.versions[t.versions.length-1]:null;

  let callout;
  if(!p.teams.length&&!curTask) callout=`<div class="callout warn">${ic("members")}<div><div class="ct">Bạn chưa thuộc team nào</div><div class="cd">Bấm “Sửa hồ sơ” để chọn team của bạn.</div></div></div>`;
  else if(!curTask) callout=`<div class="callout none">${ic("tasks")}<div><div class="ct">Team của bạn chưa có việc nào</div><div class="cd">Leader hoặc Giảng viên sẽ giao việc ở mục Công việc.</div></div></div>`;
  else if(!t) callout=`<div class="callout none">${ic("up")}<div><div class="ct">Bạn chưa nộp bài cho việc này</div><div class="cd">Điền form bên dưới để nộp bản đầu tiên.</div></div></div>`;
  else if(st==="revise") callout=`<div class="callout fix">${ic("warn")}<div style="min-width:0;flex:1"><div class="ct">Leader yêu cầu sửa bản v${t.versions.length}</div>
      <div class="cd">Đọc feedback, sửa bài rồi nộp bản <b>v${nextV}</b> ở form bên dưới.</div>${lastRev&&lastRev.feedback?`<div class="quote">${esc(lastRev.feedback)}</div>`:""}</div></div>`;
  else if(st==="passed") callout=`<div class="callout pass">${ic("check")}<div><div class="ct">Bài đã Đạt${t.score!=null?` · ${t.score}/10`:""}</div><div class="cd">${lastRev&&lastRev.feedback?esc(lastRev.feedback):"Chúc mừng! Không cần nộp thêm."}</div></div></div>`;
  else if(st==="reviewing") callout=`<div class="callout rev">${ic("clock")}<div><div class="ct">Leader đang review bản v${t.versions.length}</div><div class="cd">Bạn vẫn có thể nộp bản mới nếu muốn cập nhật thêm.</div></div></div>`;
  else callout=`<div class="callout wait">${ic("clock")}<div><div class="ct">Đã nộp bản v${t.versions.length} · chờ Leader review</div><div class="cd">Nộp lúc ${fmtDate(t.lastSubmittedAt)}. Bạn có thể nộp bản mới nếu cần sửa thêm.</div></div></div>`;

  const form= canSubmit? `
    <div class="card"><div class="card-h"><h2>${t?`Nộp bản mới <span class="vtag">v${nextV}</span>`:"Nộp sản phẩm"}</h2>${t?`<span class="sub">Đã điền sẵn từ bản v${t.versions.length}, chỉ cần sửa phần thay đổi</span>`:""}</div>
      <form class="card-b form" id="sf">
        <div class="field"><label for="sf-title">Tiêu đề <span class="req">*</span></label><input type="text" id="sf-title" maxlength="140" placeholder="VD: Bảng khái niệm Malware roles" value="${prev?esc(prev.title):""}"></div>
        <div class="field"><label for="sf-desc">Mô tả ngắn</label><textarea id="sf-desc" placeholder="Nội dung chính, phạm vi, nguồn tham khảo…">${prev?esc(prev.description):""}</textarea></div>
        ${t?`<div class="field"><label for="sf-change">Bạn đã sửa gì so với bản trước? <span class="req">*</span></label><textarea id="sf-change" style="min-height:64px" placeholder="VD: Bổ sung 3 ví dụ cho Procedure, sửa định nghĩa Stager theo feedback…"></textarea></div>`:""}
        <div class="field"><label for="sf-link">Link Google Drive <span class="req">*</span></label><input type="url" id="sf-link" placeholder="https://drive.google.com/…" value="${prev?esc(prev.link||""):""}">
          <span class="hint">Trên Drive, bấm Chia sẻ → "Bất kỳ ai có đường liên kết" để mọi người mở được.</span></div>
        <div class="field"><label for="sf-note">Ghi chú cho Leader</label><input type="text" id="sf-note" maxlength="300" placeholder="Điều muốn Leader lưu ý khi chấm"></div>
        <div class="err" id="sf-err"></div>
        <div><button class="btn primary" type="submit" id="sf-btn">${ic("send")}${t?`Nộp bản v${nextV}`:"Nộp sản phẩm"}</button></div>
      </form></div>` : "";

  view.innerHTML=`<div class="stack">
    <div class="card card-b" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      ${avatar(p,"")}
      <div style="flex:1;min-width:200px"><div style="font-family:var(--f-d);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1">Chào ${esc(p.fullName||p.name)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${teamChips(p)}</div>
        ${p.teams.map(id=>Store.team(id)).filter(x=>x&&x.topic).map(x=>`<div class="muted" style="font-size:13.5px;margin-top:6px">${esc(x.name)}: ${esc(x.topic)}</div>`).join("")}
        <button class="btn ghost sm" type="button" id="editMe" style="margin-top:8px;margin-left:-12px">${ic("edit")}Sửa hồ sơ (tên, avatar, team)</button></div>
      <div class="field" style="min-width:260px;flex:0 1 360px"><label for="mine-task">Đang xem việc</label>
        <select id="mine-task">${myTasks.length?myTasks.map(x=>{ const th=Store.threads[me+"__"+x.id]; const mineAsg=(x.assignees||[]).includes(me);
          return `<option value="${esc(x.id)}" ${x.id===curTask?"selected":""}>${esc(x.name)} · ${esc(Store.teamName(x.teamId))}${mineAsg?" ★":""}${th?" — "+ST[th.status].label:""}</option>`; }).join(""):`<option value="">Chưa có việc</option>`}</select>
        ${k?`<span class="hint" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${taskTag(k)}${fmtDue(k.due)}${(k.assignees||[]).includes(me)?"★ Việc được giao cho bạn":""}</span>`:""}</div>
    </div>
    ${callout}
    <div class="grid-2">
      <div class="stack">${form}${k&&k.desc?`<div class="card card-b"><div class="section-label">Yêu cầu của việc</div><div style="white-space:pre-wrap;font-size:14.5px">${esc(k.desc)}</div></div>`:""}</div>
      <div class="stack">
        <div class="card"><div class="card-h"><h2>Lịch sử nộp & feedback</h2>${t?`<span class="vtag">${t.versions.length} bản</span>`:""}</div>
          <div class="card-b">${t?timelineHTML(t):`<div class="faint" style="font-size:14px">Chưa có gì. Sau khi nộp, các bản và feedback của Leader sẽ hiện ở đây.</div>`}</div></div>
        ${t?`<div class="card card-b">${commentsBlock(t,"cmt-in-mine")}</div>`:""}
      </div>
    </div></div>`;
  $("#mine-task").onchange=e=>{ App.mineTask=e.target.value; App.clearForm=true; App.render(); };
  $("#editMe").onclick=()=>personForm(p);
  const bigAv=view.querySelector(".card-b>.av"); if(bigAv){ bigAv.style.cssText="width:64px;height:64px;border-radius:20px;font-size:20px"; }
  bindComments(view);
  const f=$("#sf"); if(!f) return;
  f.onsubmit=async e=>{ e.preventDefault(); const err=$("#sf-err"); err.textContent="";
    const title=$("#sf-title").value.trim(), link=$("#sf-link").value.trim();
    if(!title){ err.textContent="Nhập tiêu đề."; $("#sf-title").focus(); return; }
    if(!link){ err.textContent="Dán link Google Drive của sản phẩm."; $("#sf-link").focus(); return; }
    if(!safeUrl(link)){ err.textContent="Link phải bắt đầu bằng https://"; $("#sf-link").focus(); return; }
    const change=$("#sf-change")?$("#sf-change").value.trim():"";
    if(t&&!change){ err.textContent="Ghi ngắn gọn bạn đã sửa gì để Leader review nhanh hơn."; $("#sf-change").focus(); return; }
    $("#sf-btn").disabled=true;
    try{ const v=await Store.submit(me,curTask,{title,description:$("#sf-desc").value.trim(),link,changeNote:change,memberNote:$("#sf-note").value.trim()});
      App.clearForm=true; App.render(); window.scrollTo(0,0);
      toast(`Đã nộp bản v${v} ✓`); }
    catch(e2){ writeErr(e2); $("#sf-btn").disabled=false; } };
}

    </div>

    ${App.isStaff()||Store.mode!=="cloud"?`<div class="card" id="setup"><div class="card-h"><h2>Kết nối đám mây (Firebase)</h2>
      ${Store.mode==="cloud"?badge("passed").replace("Đạt","Đã kết nối"):`<span class="badge b-rev"><i></i>Chưa kết nối</span>`}</div>
      <div class="card-b">${Store.mode==="cloud"?`<p style="margin:0 0 14px">Web đang dùng Firebase project <code class="mono">${esc(FIREBASE_CONFIG.projectId)}</code>. Cập nhật giao diện (thay file <code>index.html</code>) không ảnh hưởng tới dữ liệu.</p>`:`<p style="margin:0 0 16px">Hiện dữ liệu chỉ nằm trên trình duyệt này, mỗi người sẽ thấy một kiểu. Làm 6 bước sau một lần để cả nhóm dùng chung:</p>`}${setupHTML()}</div></div>`:""}

    <div class="card"><div class="card-h"><h2>Hướng dẫn nhanh</h2></div><div class="card-b guide">
      <div class="g"><h3>Thành viên</h3><ol><li>Màn hình đầu → Thành viên → bấm vào tên của mình (chưa có thì “Thêm hồ sơ của tôi”, chọn một hoặc nhiều team).</li><li>Điền tiêu đề, mô tả, dán link Google Drive → Nộp. Bị “Cần sửa” thì nộp bản mới.</li><li>Vào “Khám phá” xem bài các team và góp ý.</li></ol></div>
      <div class="g"><h3>Leader</h3><ol><li>Chọn team của mình, nhập mật khẩu Leader.</li><li>Chấm điểm, viết feedback, yêu cầu sửa cho bài của team mình.</li><li>Thêm người đã có hồ sơ vào team, giao việc ở mục Công việc.</li></ol></div>
      <div class="g"><h3>Giảng viên</h3><ol><li>Vào bằng mật khẩu Giảng viên.</li><li>Xem mọi team, kể cả ghi chú riêng của Leader.</li><li>Giao việc cho một team hoặc cả các team (tag “Giảng viên giao”).</li></ol></div>
    </div></div>
  </div>`;
  view.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  bindSetup(view);
}
function openChangePass(){
  const key=App.authKey(); const who=App.isTeacher()?"Giảng viên":"Leader "+Store.teamName(App.session.teamId);
  openModal({title:"Đổi mật khẩu "+esc(who), sub:"Mật khẩu mới áp dụng ngay cho mọi người",
    body:`<form class="form" id="cp">
      <div class="field"><label for="cp-old">Mật khẩu hiện tại</label><input type="password" id="cp-old" autocomplete="current-password"></div>
      <div class="field"><label for="cp-new">Mật khẩu mới</label><input type="password" id="cp-new" autocomplete="new-password"><span class="hint">Ít nhất 6 ký tự.</span></div>
      <div class="field"><label for="cp-new2">Nhập lại mật khẩu mới</label><input type="password" id="cp-new2" autocomplete="new-password"></div>
      <div class="err" id="cp-err"></div></form>`,
    foot:`<span class="spacer"></span><button class="btn" type="button" data-close>Hủy</button><button class="btn primary" type="button" id="cp-ok">${ic("check")}Đổi mật khẩu</button>`});
  const ok=async()=>{ const err=$("#cp-err"); err.textContent="";
    const o=$("#cp-old").value, n=$("#cp-new").value, n2=$("#cp-new2").value;
    if(!o){ err.textContent="Nhập mật khẩu hiện tại."; $("#cp-old").focus(); return; }
    if(n.length<6){ err.textContent="Mật khẩu mới cần ít nhất 6 ký tự."; $("#cp-new").focus(); return; }
    if(n!==n2){ err.textContent="Hai lần nhập mật khẩu mới không khớp."; $("#cp-new2").focus(); return; }
    if(n===o){ err.textContent="Mật khẩu mới phải khác mật khẩu hiện tại."; return; }
    $("#cp-ok").disabled=true;
    try{
      if(!(await checkPass(key,o))){ err.textContent="Mật khẩu hiện tại không đúng."; $("#cp-ok").disabled=false; $("#cp-old").focus(); return; }
      await setPass(key,n); closeModal(); toast("Đã đổi mật khẩu "+who);
    }catch(e){ writeErr(e); $("#cp-ok").disabled=false; } };
  $("#cp-ok").onclick=ok; $("#cp").onsubmit=e=>{e.preventDefault();ok();}; $("#cp-old").focus();
}
function copyText(s){ const ok=()=>toast("Đã sao chép"); try{ navigator.clipboard.writeText(s).then(ok,()=>toast("Hãy bôi đen và nhấn Ctrl+C")); }catch(e){ toast("Hãy bôi đen và nhấn Ctrl+C"); } }

/* ---------------- backup / restore ---------------- */
async function saveTextFile(name, text){
  if(App.downloads){ try{ const r=await App.downloads.save({filename:name,data:text}); return r&&r.status==="saved"; }catch(e){ if(e&&e.code==="cancelled") return false; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); return true;
}
function openExport(){
  const data=Store.exportAll(); const json=JSON.stringify(data,null,2);
  const fname="research-review-hub-"+new Date().toISOString().slice(0,10)+".json";
  openModal({title:"Sao lưu dữ liệu",sub:`${data.teams.length} team · ${data.people.length} người · ${data.tasks.length} việc · ${data.threads.length} bài nộp · ${data.comments.length} góp ý`,
    body:`<p style="margin:0 0 12px">Tải toàn bộ dữ liệu về máy thành một file JSON. Nên làm trước mỗi lần cập nhật lớn.</p>
      <textarea id="expArea" readonly style="min-height:200px;font-family:var(--f-m);font-size:12px">${esc(json.length>200000?json.slice(0,200000)+"\n…(đã rút gọn khi hiển thị, file lưu đầy đủ)":json)}</textarea>`,
    foot:`<span class="spacer"></span><button class="btn" type="button" id="expCopy">${ic("copy")}Sao chép</button><button class="btn primary" type="button" id="expSave">${ic("download")}Tải file .json</button>`});
  $("#expCopy").onclick=()=>{ try{ navigator.clipboard.writeText(json).then(()=>toast("Đã sao chép JSON"),()=>{ $("#expArea").select(); toast("Hãy nhấn Ctrl+C để sao chép"); }); }catch(e){ $("#expArea").select(); } };
  $("#expSave").onclick=async()=>{ if(await saveTextFile(fname,json)) toast("Đã tải "+fname); };
}
function openImport(){
  openModal({title:"Khôi phục dữ liệu",sub:"Thay toàn bộ dữ liệu hiện tại bằng một file sao lưu",
    body:`<div class="form"><label class="filebox" id="imBox">${ic("file")}<span id="imName">Chọn file .json</span><input type="file" id="imFile" accept=".json,application/json"></label>
      <textarea id="imArea" placeholder="Hoặc dán nội dung JSON vào đây…" style="min-height:150px;font-family:var(--f-m);font-size:12px"></textarea>
      <div class="callout rev" style="padding:12px 14px">${ic("warn")}<div class="cd" style="margin:0">Dữ liệu hiện tại của <b>tất cả các team</b> sẽ bị thay thế. Nhận cả file sao lưu của bản cũ (v6).</div></div>
      <div class="err" id="imErr"></div></div>`,
    foot:`<span class="spacer"></span><button class="btn" type="button" data-close>Hủy</button><button class="btn primary" type="button" id="imOk">${ic("up")}Khôi phục</button>`});
  $("#imFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("#imArea").value=r.result; $("#imName").textContent=f.name; $("#imBox").classList.add("has"); }; r.readAsText(f); };
  $("#imOk").onclick=async()=>{ const txt=$("#imArea").value.trim(); if(!txt){ $("#imErr").textContent="Chưa có dữ liệu."; return; }
    let data; try{ data=JSON.parse(txt); }catch(e){ $("#imErr").textContent="JSON không hợp lệ: "+e.message; return; }
    $("#imOk").disabled=true;
    try{ await Store.importAll(data); closeModal(); toast("Khôi phục thành công"); }
    catch(e){ $("#imErr").textContent=e.message||"Khôi phục thất bại."; $("#imOk").disabled=false; } };
}

/* ---------------- modal ---------------- */
function openModal({title,sub,body,foot,wide}){
  $("#modalRoot").innerHTML=`<div class="scrim" id="scrim"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-h"><div style="min-width:0"><div class="t" id="mt">${title}</div>${sub?`<div class="s">${sub}</div>`:""}</div>
      <button class="icon-btn round" type="button" data-close aria-label="Đóng">${ic("x")}</button></div>
    <div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div></div>`;
  $("#scrim").addEventListener("mousedown",e=>{ if(e.target.id==="scrim") closeModal(); });
  $("#modalRoot").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  document.addEventListener("keydown",escKey);
}
function escKey(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){ $("#modalRoot").innerHTML=""; document.removeEventListener("keydown",escKey); }

/* ---------------- theme / nav ---------------- */
function isDark(){ const a=document.documentElement.getAttribute("data-theme"); return a? a==="dark" : !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches); }
function initTheme(){ try{ const t=localStorage.getItem("rrh-theme"); document.documentElement.setAttribute("data-theme", t||"dark"); }catch(e){ document.documentElement.setAttribute("data-theme","dark"); } }
function toggleTheme(){ const n=isDark()?"light":"dark"; document.documentElement.setAttribute("data-theme",n); try{ localStorage.setItem("rrh-theme",n); }catch(e){} setTimeout(()=>Graph.recolor(),0); }
function openNav(){ $("#sidebar").classList.add("open"); $("#scrimNav").hidden=false; }
function closeNav(){ const s=$("#sidebar"); if(s) s.classList.remove("open"); const c=$("#scrimNav"); if(c) c.hidden=true; }

/* ---------------- connect to data ---------------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Không tải được "+src)); document.head.appendChild(s); }); }
async function connect(){
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.projectId){
    try{
      await loadScript(FIREBASE_SDK+"firebase-app-compat.js");
      await loadScript(FIREBASE_SDK+"firebase-firestore-compat.js");
      const fb=window.firebase; const app=fb.apps&&fb.apps.length? fb.app() : fb.initializeApp(FIREBASE_CONFIG);
      Store.attach(app.firestore(), "cloud");
    }catch(e){ Store.error=e; Store.mode="cloud"; App.render(); toast("Không kết nối được Firebase. Kiểm tra mạng rồi tải lại trang."); }
    return;
  }
  if(window.claude && window.claude.use){
    let db=null;
    try{ db=await window.claude.use("db"); }catch(e){ db=null; }
    try{ App.downloads=await window.claude.use("downloads"); }catch(e){ App.downloads=null; }
    if(db){ Store.attach(db,"claude"); return; }
  }
  Store.attach(LocalDB(),"local");
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>App.init()); else App.init();

</script>
</body>
